[project]
name = "vettore"
version = "0.3.0"
description = "Offline plasmid editor: maps, cloning simulation, primer design and Sanger verification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "biopython>=1.88",
    "pydna>=5.5.16",
    "primer3-py>=2.3.1",
    # .dna details Biopython does not read (colours, primer tails); 0.x, pinned.
    "sgffp>=0.22.1,<0.23",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=6.2",
    # Native window backend on Linux (Windows uses Edge WebView2 through pythonnet).
    "PyQt6>=6.7; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.7; sys_platform == 'linux'",
    "QtPy>=2.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pyinstaller>=6.11"]

[project.scripts]
vettore = "vettore.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vettore"]
artifacts = ["src/vettore/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
