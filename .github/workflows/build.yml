name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Vettore-windows-x64
            exe: dist/Vettore/Vettore.exe
          - os: ubuntu-24.04
            artifact: Vettore-linux-x64
            exe: dist/Vettore/Vettore
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Linux system libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Python tests
        run: |
          uv sync --extra dev
          uv run --no-sync ruff check src tests packaging
          uv run --no-sync pytest -q

      - name: End-to-end tests (browser)
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - name: Package with PyInstaller
        shell: bash
        run: |
          rm -rf src/vettore/static
          cp -r frontend/dist src/vettore/static
          uv run --no-sync pyinstaller packaging/vettore.spec --noconfirm

      - name: Smoke-test the packaged app
        shell: bash
        run: uv run --no-sync python packaging/smoke_test.py "${{ matrix.exe }}"

      - name: Native window screenshot (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\Vettore\Vettore.exe" -ArgumentList "tests\data\pFA-KanMX4.dna"
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-native.png")
          Get-Content "$env:USERPROFILE\.vettore\vettore.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          Stop-Process -Name Vettore -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        continue-on-error: true
        with:
          name: windows-native-screenshot
          path: windows-native.png

      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "../${{ matrix.artifact }}.zip" Vettore; else zip -qr "../${{ matrix.artifact }}.zip" Vettore; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}.zip
